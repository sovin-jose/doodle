spring.application.name=demo

# PostgreSQL datasource — overridable via environment for docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doodle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:doodle}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — Flyway owns the schema, Hibernate never touches DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway is wired explicitly in FlywayBootstrap (Boot 4.1 auto-config wasn't
# picking it up). The bean has initMethod=migrate so schema is applied at
# startup, before any repository queries.
spring.flyway.enabled=false

# Actuator: expose health, info, metrics, and Prometheus scrape endpoint.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Graceful shutdown so in-flight requests finish before the JVM exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
