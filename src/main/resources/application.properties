spring.application.name=demo

# PostgreSQL datasource — overridable via environment for docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doodle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:doodle}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — Flyway owns the schema, Hibernate never touches DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway auto-migrates at application startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
