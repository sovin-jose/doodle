spring.application.name=demo

# SQLite datasource
spring.datasource.url=jdbc:sqlite:./data/doodle.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate — Flyway owns the schema, so Hibernate only validates.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway. Auto-migrate at startup is enabled only for SQLite (see FlywayConfig).
# For any other JDBC vendor, set app.flyway.auto-migrate=true to force it,
# or trigger migrations manually via POST /admin/migrate.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
app.flyway.auto-migrate=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
